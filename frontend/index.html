<!doctype html>
<html lang="ru" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Рули — поминутная аренда автомобилей в Минске" />
    <meta name="theme-color" content="#1834D6" />
    <meta name="color-scheme" content="dark light" />

    <!-- PWA: установка на главный экран телефона -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Рули" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Рули — каршеринг в Минске</title>
    <script>
      // Тема до первой отрисовки — без вспышки светлого экрана.
      try {
        var saved = localStorage.getItem('ruli:theme') || 'auto'
        var day = saved === 'day' || (saved === 'auto' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = day ? 'day' : 'night'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
