upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    # Пять фото осмотра по 8 МБ плюс служебные поля multipart; клиент к тому же уменьшает снимки.
    client_max_body_size 45m;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/static/;
        expires 7d;
    }

    # Документы водителей сюда не попадают (отдельный том), но на случай ошибки
    # в настройках путь закрыт явно.
    location ^~ /media/verification/ {
        return 404;
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Service worker всегда свежий: иначе обновление приложения застрянет в кэше браузера.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Маршруты React Router обслуживает index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
