# Имя задано явно: из кириллического названия папки Compose его вывести не может.
name: carsharing

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: carsharing
      MYSQL_USER: carsharing
      MYSQL_PASSWORD: carsharing
      MYSQL_ROOT_PASSWORD: root
      TZ: Europe/Minsk
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Проверка по TCP: во время первичной инициализации MySQL сеть отключена,
      # поэтому «здоров» означает «полностью готов принимать подключения».
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DEBUG: "False"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,.trycloudflare.com}"
      DATABASE_URL: mysql://carsharing:carsharing@db:3306/carsharing
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,https://*.trycloudflare.com}"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      PRIVATE_MEDIA_ROOT: /app/private_media
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - secret_data:/run/carsharing-secrets
      # Сканы документов водителей — отдельный том, подключён только к бэкенду.
      - private_data:/app/private_media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/cars/', timeout=5)"
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  nginx:
    build: ./frontend
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  mysql_data:
  static_data:
  media_data:
  private_data:
  secret_data:
